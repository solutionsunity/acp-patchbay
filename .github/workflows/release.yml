name: Release

# Builds the .vsix, checksums it, and publishes a GitHub Release when a
# v<version> tag is pushed, then publishes that same .vsix to Open VSX and the
# Visual Studio Marketplace. No publish secret exists to protect: each store
# takes this run's short-lived OIDC token, accepted only from this repository
# and only in that store's GitHub environment, which admits `v*` tags alone.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    # What the store jobs publish under — read here once, from the tag.
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deterministic sanity gate — the headless-safe subset of `npm run check`.
      # The full gate (electron suite, UI shots) runs at dev time before tagging.
      - name: Typecheck
        run: npm run typecheck
      # The integration tests spawn the real bundled subprocesses
      # (out/mcp-server.js, out/mcp-bridge.js) and a fake agent
      # (out-test/fake-agent.mjs) — build them first, as pretest:vscode does.
      - name: Build test prerequisites
        run: npm run build && node scripts/build-fake-agent.mjs
      - name: Unit tests
        run: npm test

      - name: Verify tag matches package.json version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$TAG_VERSION) != package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package .vsix
        run: npx vsce package --out "acp-patchbay-${version}.vsix"

      - name: Checksum
        run: sha256sum "acp-patchbay-${version}.vsix" | tee "acp-patchbay-${version}.vsix.sha256"

      # Marketplace parity: even minor = stable, odd minor = pre-release.
      - name: Determine release channel
        id: channel
        run: |
          MINOR="$(echo "$version" | cut -d. -f2)"
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "prerelease=--prerelease" >> "$GITHUB_ENV"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Odd minor ($MINOR) -> pre-release"
          else
            echo "prerelease=" >> "$GITHUB_ENV"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Even minor ($MINOR) -> stable"
          fi

      # The release's own text is a heads-up: the summary paragraph that opens
      # the version's CHANGELOG section, at most 3 lines. The entries stay in
      # the CHANGELOG; gh appends the generated compare link after the summary.
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { f = 1; next }
            f && /^## / { exit }
            f && NF { s = 1; print; next }
            f && s { exit }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          if grep -q '^- ' release-notes.md; then
            echo "::error::CHANGELOG.md section $version opens with entries, not a summary paragraph"
            exit 1
          fi
          if [ "$(wc -l < release-notes.md)" -gt 3 ]; then
            echo "::error::CHANGELOG.md summary for $version is over 3 lines"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "acp-patchbay-${version}.vsix" \
            "acp-patchbay-${version}.vsix.sha256" \
            --title "v${version}" \
            --notes-file release-notes.md \
            --generate-notes \
            ${prerelease}

  # Each store is its own job, so a failed publish re-runs alone ("Re-run
  # failed jobs") instead of re-running the release, whose create step
  # refuses a release that already exists. Each publishes the asset the
  # release carries, checked against its checksum, never a second build —
  # fetched by the job itself, since every job runs on its own machine.
  open-vsx:
    needs: release
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read # download the release asset
      id-token: write # the OIDC token ovsx exchanges for a short-lived key
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum -c ./*.vsix.sha256

      # No token is passed: --trusted-publishing exchanges this run's ID
      # token, and fails outright when none is on offer. --skip-duplicate
      # keeps a re-run, or a version already uploaded by hand, from failing
      # the job.
      - name: Publish to Open VSX
        run: |
          npx --yes ovsx@1.2.0 publish "acp-patchbay-${{ needs.release.outputs.version }}.vsix" \
            --trusted-publishing --skip-duplicate ${{ needs.release.outputs.prerelease == 'true' && '--pre-release' || '' }}

  marketplace:
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read # download the release asset
      id-token: write # the OIDC token Entra ID exchanges for a short-lived one
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the released .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern "*.vsix" --pattern "*.vsix.sha256"
          sha256sum -c ./*.vsix.sha256

      # Workload identity federation: Entra ID trusts a token GitHub issues to
      # this repository's `marketplace` environment and signs the run in as
      # the app the SolutionsUnity publisher lists as a Contributor. The ids
      # are identifiers, not secrets; no Azure subscription is involved.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # verify-pat first, so a lost publisher role fails here, named, before
      # any upload. --skip-duplicate keeps a re-run, or a version already
      # uploaded by hand, from failing the job.
      - name: Publish to the Marketplace
        run: |
          npx --yes @vscode/vsce@3.9.2 verify-pat SolutionsUnity --azure-credential
          npx --yes @vscode/vsce@3.9.2 publish --azure-credential \
            --packagePath "acp-patchbay-${{ needs.release.outputs.version }}.vsix" \
            --skip-duplicate ${{ needs.release.outputs.prerelease == 'true' && '--pre-release' || '' }}
